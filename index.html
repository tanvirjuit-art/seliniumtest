```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            width: 50%;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #777;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .terms {
            font-size: 13px;
            color: #777;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .terms input {
            margin-right: 6px;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">MyAccount</div>
    <p class="subtitle">Welcome to your account</p>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="showForm('login', this)">
            Login
        </button>

        <button class="tab" onclick="showForm('register', this)">
            Register
        </button>
    </div>

    <!-- Login Form -->
    <form id="login" class="form active" onsubmit="loginUser(event)">

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >
        </div>

        <a href="#" class="forgot">Forgot Password?</a>

        <button type="submit" class="btn">
            Login
        </button>

        <div id="loginMessage" class="message"></div>

    </form>


    <!-- Registration Form -->
    <form id="register" class="form" onsubmit="registerUser(event)">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required
            >
        </div>

        <div class="terms">
            <label>
                <input type="checkbox" required>
                I agree to the Terms & Conditions
            </label>
        </div>

        <button type="submit" class="btn">
            Create Account
        </button>

        <div id="registerMessage" class="message"></div>

    </form>

</div>


<script>

    // Login / Registration Tab
    function showForm(formId, button) {

        document.querySelectorAll(".form").forEach(form => {
            form.classList.remove("active");
        });

        document.querySelectorAll(".tab").forEach(tab => {
            tab.classList.remove("active");
        });

        document.getElementById(formId).classList.add("active");
        button.classList.add("active");
    }


    // Registration
    function registerUser(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message = document.getElementById("registerMessage");

        if (password !== confirmPassword) {

            message.textContent = "Passwords do not match!";
            message.className = "message error";
            message.style.display = "block";

            return;
        }

        // Demo registration
        localStorage.setItem("user", JSON.stringify({
            name: name,
            email: email,
            phone: phone,
            password: password
        }));

        message.textContent = "Registration successful!";
        message.className = "message success";
        message.style.display = "block";

        event.target.reset();
    }


    // Login
    function loginUser(event) {

        event.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        const message = document.getElementById("loginMessage");

        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {

            message.textContent =
                "No account found. Please register first.";

            message.className = "message error";
            message.style.display = "block";

            return;
        }

        if (email === user.email && password === user.password) {

            message.textContent =
                "Login successful! Welcome " + user.name;

            message.className = "message success";
            message.style.display = "block";

        } else {

            message.textContent =
                "Invalid email or password.";

            message.className = "message error";
            message.style.display = "block";
        }
    }

</script>

</body>
</html>
